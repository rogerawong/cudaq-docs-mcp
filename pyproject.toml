[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cudaq-docs-mcp"
version = "0.1.0"
description = "MCP server serving NVIDIA CUDA-Q documentation, API reference, and runnable examples to AI agents, version-pinned to your installed cudaq."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Roger Wong", email = "rogerawong@gmail.com" }]
keywords = ["mcp", "cuda-q", "cudaq", "quantum", "documentation", "agents", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.0,<3", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cudaq-docs-mcp = "cudaq_docs_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/rogerawong/cudaq-docs-mcp"
Repository = "https://github.com/rogerawong/cudaq-docs-mcp"
Issues = "https://github.com/rogerawong/cudaq-docs-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cudaq_docs_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
